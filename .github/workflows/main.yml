name: Update Job & Scholarship Listings

on:
  schedule:
    # Runs 4 times a day (00:00, 06:00, 12:00, 18:00 UTC) — fully automatic
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write   # required so the workflow can save the updated file back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run job scraper
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/fetch_jobs.py

      - name: Run scholarship scraper
        run: python scripts/fetch_scholarships.py

      - name: Commit updated listings back to the repo
        run: |
          git config user.name "opportunity-desk-bot"
          git config user.email "actions@github.com"
          mkdir -p data
          if [ ! -f data/listings.json ]; then echo "[]" > data/listings.json; fi
          git add data/listings.json
          git diff --quiet --cached || git commit -m "Auto-update listings"
          git pull --rebase origin main
          git push origin main
