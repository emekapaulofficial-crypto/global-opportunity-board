<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opportunity Desk — Visa Sponsorship Jobs & Fully Funded Scholarships</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B2545;
    --navy-deep:#071B33;
    --parchment:#F3EEDD;
    --parchment-dark:#E7DFC4;
    --gold:#B8892E;
    --teal:#1B6B73;
    --ink:#1C1B19;
    --stamp-red:#A6303A;
    --stamp-green:#2F6B4F;
    --stamp-amber:#A6742E;
    --line: rgba(28,27,25,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--navy-deep);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em; }

  header{
    background:
      radial-gradient(circle at 15% 20%, rgba(184,137,46,0.12), transparent 40%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    padding: 3.2rem 1.5rem 2.4rem;
    text-align:center;
    border-bottom: 3px double rgba(184,137,46,0.5);
    position:relative;
  }
  header .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    color: var(--gold);
    letter-spacing:0.3em;
    font-size:0.7rem;
    text-transform:uppercase;
    margin-bottom:0.9rem;
  }
  header h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: clamp(2.1rem, 5vw, 3.4rem);
    color: var(--parchment);
    letter-spacing:0.01em;
  }
  header p.tagline{
    color: rgba(243,238,221,0.65);
    margin-top:0.8rem;
    font-size:1rem;
    max-width:520px;
    margin-left:auto;
    margin-right:auto;
  }
  header .updated{
    margin-top:1.4rem;
    font-size:0.72rem;
    color: rgba(184,137,46,0.85);
    text-transform:uppercase;
  }

  .filter-bar{
    background: var(--parchment);
    border-bottom: 1px solid var(--line);
    padding: 1.1rem 1.5rem;
    display:flex;
    flex-wrap:wrap;
    gap:0.7rem;
    justify-content:center;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
  }
  .filter-bar input[type="text"], .filter-bar select{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.88rem;
    padding:0.55rem 0.9rem;
    border:1.5px solid var(--ink);
    background: #fff;
    color: var(--ink);
    border-radius:2px;
  }
  .filter-bar input[type="text"]{ min-width:220px; flex:1 1 220px; }
  .filter-bar select{ cursor:pointer; }

  main{
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.2rem 1.3rem 4rem;
  }
  .count-row{
    color: rgba(243,238,221,0.7);
    font-size:0.85rem;
    margin-bottom:1.2rem;
    font-family:'IBM Plex Mono', monospace;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.3rem;
  }

  .card{
    background: var(--parchment);
    border-radius: 3px;
    position:relative;
    padding: 1.4rem 1.4rem 1.2rem;
    box-shadow: 0 8px 20px rgba(0,0,0,0.28);
    border: 1px solid var(--line);
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; bottom:0; left:0;
    width:6px;
    background-image: radial-gradient(circle, var(--navy-deep) 2px, transparent 2.2px);
    background-size: 6px 12px;
    background-repeat: repeat-y;
    opacity:0.35;
  }
  .card .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.66rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color: var(--teal);
    font-weight:600;
  }
  .card .eyebrow .platform{
    color: rgba(28,27,25,0.45);
    font-weight:500;
  }
  .card .dates{
    display:flex;
    flex-wrap:wrap;
    gap: 0.4rem 1rem;
    margin-top:0.6rem;
  }
  .card .dates span{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
  }
  .card .dates .posted{ color:#4a473f; }
  .card .dates .deadline{ color: var(--stamp-red); font-weight:600; }
  .card .nigeria-note{
    font-size:0.78rem;
    color: var(--teal);
    font-style: italic;
    margin-top:0.3rem;
  }
  .card .app-status{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding: 0.15rem 0.55rem;
    border-radius: 3px;
    margin-top:0.5rem;
  }
  .card .app-status.open{ background: rgba(47,107,79,0.15); color: var(--stamp-green); }
  .card .app-status.closed{ background: rgba(166,48,58,0.12); color: var(--stamp-red); }
  .card .app-status.unknown{ background: rgba(122,117,104,0.12); color:#7a7568; }
  .card h3{
    font-family:'Fraunces', serif;
    font-size:1.22rem;
    line-height:1.3;
    margin:0.4rem 0 0.5rem;
    color: var(--navy-deep);
    padding-right: 88px;
  }
  .card .meta{
    font-size:0.85rem;
    color:#4a473f;
    margin-bottom:0.3rem;
  }
  .card .meta strong{ color: var(--ink); }
  .card a.view-link{
    display:inline-block;
    margin-top:0.9rem;
    font-size:0.82rem;
    font-weight:600;
    color: var(--navy-deep);
    text-decoration:none;
    border-bottom: 1.5px solid var(--gold);
    padding-bottom:1px;
  }
  .card a.view-link:hover{ color: var(--teal); border-color: var(--teal); }

  .stamp{
    position:absolute;
    top: 16px;
    right: 14px;
    width: 84px;
    height: 84px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    border-radius:50%;
    border: 2.5px solid;
    transform: rotate(-11deg);
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:0.62rem;
    letter-spacing:0.03em;
    line-height:1.15;
    text-transform:uppercase;
    opacity:0.92;
    padding: 6px;
    filter: url(#inkTexture);
  }
  .stamp::after{
    content:"";
    position:absolute;
    inset:5px;
    border: 1px solid currentColor;
    border-radius:50%;
  }
  .stamp.sponsored{ color: var(--stamp-green); border-color: var(--stamp-green); }
  .stamp.funded{ color: var(--stamp-green); border-color: var(--stamp-green); }
  .stamp.no-sponsorship{ color: var(--stamp-red); border-color: var(--stamp-red); }
  .stamp.partial{ color: var(--stamp-amber); border-color: var(--stamp-amber); }
  .stamp.unclear{ color:#7a7568; border-color:#7a7568; }

  .empty, .loading{
    text-align:center;
    color: rgba(243,238,221,0.6);
    padding: 3rem 1rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.9rem;
  }

  footer{
    text-align:center;
    padding: 2rem 1.5rem 2.6rem;
    color: rgba(243,238,221,0.5);
    font-size:0.78rem;
    border-top: 1px solid rgba(184,137,46,0.25);
  }
  footer a{ color: var(--gold); text-decoration:none; }

  @media (max-width:480px){
    .card h3{ padding-right:0; }
    .stamp{ position:static; margin-bottom:0.6rem; transform: rotate(-4deg); }
  }
</style>
</head>
<body>

<svg width="0" height="0">
  <filter id="inkTexture">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2"/>
  </filter>
</svg>

<header>
  <div class="eyebrow">ClearMark Creative &middot; Global Travel Agency</div>
  <h1>Opportunity Desk</h1>
  <p class="tagline">Live-screened jobs and scholarships, stamped by sponsorship &amp; funding status — so you stop searching and start applying.</p>
  <div class="updated mono" id="lastUpdated">Loading feed…</div>
</header>

<div class="filter-bar">
  <input type="text" id="searchInput" placeholder="Search title, company, country…">
  <select id="typeFilter">
    <option value="all">All types</option>
    <option value="job">Jobs</option>
    <option value="scholarship">Scholarships</option>
  </select>
  <select id="statusFilter">
    <option value="all">All statuses</option>
    <option value="SPONSORED">Sponsored</option>
    <option value="FULLY FUNDED">Fully funded</option>
    <option value="PARTIAL FUNDING">Partial funding</option>
    <option value="NO SPONSORSHIP">No sponsorship</option>
    <option value="UNCLEAR">Unclear</option>
  </select>
  <select id="platformFilter">
    <option value="all">All platforms</option>
    <option value="Adzuna">Adzuna</option>
    <option value="Arbeitnow">Arbeitnow</option>
    <option value="ScholarshipTab">ScholarshipTab</option>
  </select>
  <select id="levelFilter">
    <option value="all">All levels</option>
    <option value="Undergraduate">Undergraduate</option>
    <option value="Masters">Masters</option>
    <option value="PhD / Postgraduate">PhD / Postgraduate</option>
    <option value="Mixed / Fully Funded">Mixed / Fully Funded</option>
  </select>
  <select id="ieltsFilter">
    <option value="all">Any IELTS status</option>
    <option value="NOT REQUIRED">IELTS not required</option>
    <option value="REQUIRED">IELTS required</option>
    <option value="NOT STATED">IELTS not stated</option>
  </select>
</div>

<main>
  <div class="count-row" id="countRow"></div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  Built by <a href="https://behance.net/clearmarkcreative" target="_blank">ClearMark Creative</a> · Questions on a listing? Message us on
  <a href="https://wa.me/2348066966747" target="_blank">WhatsApp</a>
</footer>

<script>
  // Reads listings directly from this repo's own data file -- no external
  // service, no Google Sheets, no SheetDB. GitHub Actions updates this
  // file automatically every 6 hours.
  const DATA_URL = "data/listings.json";

  let allRows = [];

  function stampClass(status){
    switch(status){
      case "SPONSORED": return "sponsored";
      case "FULLY FUNDED": return "funded";
      case "NO SPONSORSHIP": return "no-sponsorship";
      case "PARTIAL FUNDING": return "partial";
      default: return "unclear";
    }
  }

  function stampLabel(status){
    return status || "UNCLEAR";
  }

  function render(){
    const grid = document.getElementById("grid");
    const search = document.getElementById("searchInput").value.toLowerCase();
    const type = document.getElementById("typeFilter").value;
    const status = document.getElementById("statusFilter").value;
    const platform = document.getElementById("platformFilter").value;
    const level = document.getElementById("levelFilter").value;
    const ielts = document.getElementById("ieltsFilter").value;

    const filtered = allRows.filter(row => {
      if(type !== "all" && row.type !== type) return false;
      if(status !== "all" && row.sponsorship_status !== status) return false;
      if(platform !== "all" && row.source_platform !== platform) return false;
      if(level !== "all" && row.level !== level) return false;
      if(ielts !== "all" && row.ielts_status !== ielts) return false;
      if(search){
        const blob = `${row.title} ${row.company} ${row.location} ${row.search_term}`.toLowerCase();
        if(!blob.includes(search)) return false;
      }
      return true;
    });

    document.getElementById("countRow").textContent = `${filtered.length} opportunities found`;

    if(filtered.length === 0){
      grid.innerHTML = `<div class="empty">No matches yet. Try clearing a filter — new listings are added automatically every few hours.</div>`;
      return;
    }

    grid.innerHTML = filtered.map(row => `
      <div class="card">
        <div class="stamp ${stampClass(row.sponsorship_status)}">${stampLabel(row.sponsorship_status)}</div>
        <div class="eyebrow">${row.type === "job" ? "Job" : "Scholarship"} <span class="platform">· ${escapeHtml(row.source_platform || "")}</span></div>
        <h3>${escapeHtml(row.title || "Untitled listing")}</h3>
        ${row.company ? `<div class="meta"><strong>${escapeHtml(row.company)}</strong></div>` : ""}
        ${row.location ? `<div class="meta">${escapeHtml(row.location)}</div>` : ""}
        ${row.salary ? `<div class="meta">${escapeHtml(row.salary)}</div>` : ""}
        ${row.level ? `<div class="meta">Level: <strong>${escapeHtml(row.level)}</strong></div>` : ""}
        ${row.ielts_status ? `<div class="meta">IELTS: <strong>${escapeHtml(row.ielts_status)}</strong></div>` : ""}
        ${row.nigeria_note ? `<div class="meta nigeria-note">${escapeHtml(row.nigeria_note)}</div>` : ""}
        ${row.application_status ? `<div class="app-status ${row.application_status.toLowerCase()}">${escapeHtml(row.application_status)}</div>` : ""}
        <div class="dates">
          <span class="posted">Posted: ${escapeHtml(row.date_posted || "Not stated")}</span>
          <span class="deadline">Deadline: ${escapeHtml(row.deadline || "Not stated")}</span>
        </div>
        <a class="view-link" href="${row.source_url}" target="_blank" rel="noopener">View original listing →</a>
      </div>
    `).join("");
  }

  function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  async function loadData(){
    try{
      // cache-busting so the browser always grabs the newest file
      const res = await fetch(DATA_URL + "?t=" + Date.now());
      const data = await res.json();
      allRows = Array.isArray(data) ? data : [];
      document.getElementById("lastUpdated").textContent =
        `Feed live · ${allRows.length} listings tracked`;
      render();
    }catch(e){
      document.getElementById("lastUpdated").textContent = "Feed unavailable";
      document.getElementById("grid").innerHTML = `<div class="empty">Couldn't load listings.json. Make sure data/listings.json exists in this repo.</div>`;
    }
  }

  document.getElementById("searchInput").addEventListener("input", render);
  document.getElementById("typeFilter").addEventListener("change", render);
  document.getElementById("statusFilter").addEventListener("change", render);
  document.getElementById("platformFilter").addEventListener("change", render);
  document.getElementById("levelFilter").addEventListener("change", render);
  document.getElementById("ieltsFilter").addEventListener("change", render);

  loadData();
</script>

</body>
</html>
